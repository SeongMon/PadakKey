name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: bash scripts/verify-qr.sh
      - run: bash scripts/verify-vault.sh
      - run: bash scripts/verify-mascot.sh
      - run: bash scripts/build.sh
